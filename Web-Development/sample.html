<!DOCTYPE html>
<!-- Demonstrates a button appearing after five seconds. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delayed Button</title>
</head>
<body>
    <p>The button below will appear in 5 seconds.</p>
    <button id="myButton" style="display: none;">Click Me!</button>

    <script src="../JavaScript/JavaScript.js"></script>
</body>
</html>
